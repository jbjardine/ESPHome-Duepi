esphome:
  name: duepi-room-optin-f
  friendly_name: Duepi Room Fahrenheit opt-in ESP-01 build fixture
  build_path: tests/fixtures/.esphome/room-esp01-1m-fahrenheit

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0
  logs:
    uart_debug: NONE

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Duepi Room Dummy Fallback
    password: !secret fallback_ap_password

captive_portal:

substitutions:
  min_temp: "50"
  max_temp: "95"
  temp_unit: "°F"
  tx_pin_esp: "1"
  rx_pin_esp: "3"

packages:
  duepi: !include ../../components/packages.yaml
  room_regulation: !include ../../components/packages/room_regulation.yaml

external_components:
  - source:
      type: local
      path: ../../components
    components: [duepi_room]
