esphome:
  name: duepi-room-legacy-build
  friendly_name: Duepi Room legacy build fixture
  build_path: tests/fixtures/.esphome/legacy-esp01-1m

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0
  logs:
    uart_debug: NONE

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Duepi Room Dummy Fallback
    password: !secret fallback_ap_password

captive_portal:

substitutions:
  min_temp: "10"
  max_temp: "35"
  temp_unit: "°C"
  tx_pin_esp: "1"
  rx_pin_esp: "3"

packages:
  duepi: !include ../../components/packages.yaml
