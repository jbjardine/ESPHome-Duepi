climate:
  - platform: thermostat
    on_boot_restore_from: memory
    name: "Pellet kachel"
    id: Stove
    sensor: room_temp_stove
    min_idle_time: 1s
    min_heating_off_time: 1s
    min_heating_run_time: 300s
    min_fan_mode_switching_time: 1s
    heat_action:
        - lambda: id(debug).publish_state("Thermostat heat action");
    idle_action:
        - lambda: id(debug).publish_state("Thermostat idle action");
    target_temperature_change_action:
        - if:
            condition:
              lambda: 'return id(boot_restore_in_progress) || id(climate_sync_in_progress);'
            then:
              - lambda: |-
                  id(debug).publish_state(id(boot_restore_in_progress)
                                              ? "Target temperature update suppressed during boot restore"
                                              : "Target temperature update suppressed during stove sync");
            else:
              - lambda: |-
                  #ifdef USE_DUEPI_ROOM
                  extern void duepi_room_observe_manual_native_target(float target_c);
                  duepi_room_observe_manual_native_target(id(Stove).target_temperature);
                  #endif
              - if:
                  condition:
                    lambda: 'return !id(expert_bridge_client_connected);'
                  then:
                    - wait_until:
                        condition:
                          lambda: 'return (id(uart_send) == 0);'
                        timeout: 1s
                    - script.execute:
                        id: STOVE_SET_TARGET
                        target_in: !lambda 'return static_cast<int>(id(Stove).target_temperature);'
                        automatic: false
                    - script.wait: STOVE_SET_TARGET
                    - if:
                        condition:
                          lambda: 'return (id(debug).state != "OK");'
                        then:
                          - lambda: id(debug).publish_state("Stove temp change failed");
                  else:
                    - lambda: |-
                        id(debug).publish_state("Official app connected: target temperature refused");
    fan_mode_quiet_action:
      then:
        - lambda: id(fan_mode) = 1;
    fan_mode_low_action:
      then:
        - lambda: id(fan_mode) = 2;
    fan_mode_middle_action:
      then:
        - lambda: id(fan_mode) = 3;
    fan_mode_medium_action:
      then:
        - lambda: id(fan_mode) = 4;
    fan_mode_high_action:
      then:
        - lambda: id(fan_mode) = 5;
    heat_mode:
      then:
        - script.execute:
            id: STOVE_SET_MODE
            heat: true
    off_mode:
      then:
        - script.execute:
            id: STOVE_SET_MODE
            heat: false
    visual:
      min_temperature: "${min_temp} ${temp_unit}"
      max_temperature: "${max_temp} ${temp_unit}"
      temperature_step:
        target_temperature: 1.0
        current_temperature: 0.1
