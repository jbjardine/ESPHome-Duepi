# Opt-in companion package. The main configuration must load the matching
# components/duepi_room external component from the same source revision.
duepi_room:
  id: duepi_room_main
  native_min: ${min_temp}
  native_max: ${max_temp}
  limit_unit: ${temp_unit}
  fallback_target: 20
  max_source_age: 15min
  on_rf2_target:
    then:
      - script.execute:
          id: STOVE_SET_TARGET
          target_in: !lambda 'return target;'
          automatic: true
  on_native_mode_command:
    then:
      - script.execute:
          id: STOVE_SET_MODE
          heat: !lambda 'return heat;'

climate:
  - platform: duepi_room
    duepi_room_id: duepi_room_main
    id: duepi_room_climate
    name: "Room target"

select:
  - platform: duepi_room
    duepi_room_id: duepi_room_main
    id: duepi_room_mode
    name: "Room regulation mode"

button:
  - platform: template
    id: duepi_room_rearm
    name: "Reactivate room compensation"
    icon: mdi:restart
    on_press:
      - select.set:
          id: duepi_room_mode
          option: Compensation

number:
  - platform: duepi_room
    duepi_room_id: duepi_room_main
    id: duepi_room_fallback
    name: "Room fallback target"

sensor:
  - platform: duepi_room
    duepi_room_id: duepi_room_main
    metric: source_age
    name: "Room source age"
  - platform: duepi_room
    duepi_room_id: duepi_room_main
    metric: pi_correction
    name: "Room PI correction"
  - platform: duepi_room
    duepi_room_id: duepi_room_main
    metric: computed_target
    name: "Room computed native target"

text_sensor:
  - platform: duepi_room
    duepi_room_id: duepi_room_main
    id: duepi_room_status
    name: "Room regulation status"

text:
  - platform: duepi_room
    duepi_room_id: duepi_room_main
    id: duepi_room_relay
